version: '3'

services:
  orders-db:
    container_name: orders-database
    image: postgres:16.2
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ordersdb
    ports:
      - '5432:5432'
    volumes:
      - ./postgres:/var/lib/postgresql/data
